# Fly.io settings for the Burger Bandit Island server.
# In this folder run:  fly launch --copy-config --no-deploy   then   fly deploy
app = "burger-bandit-island"
primary_region = "sea"          # Seattle, the closest Fly.io region to Vancouver

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MAX_PLAYERS = "200"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # stay on so players never wait for a wake-up
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
